name: "publish for download"

on:
  push:
    branches:
      - Release
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{matrix.platform}}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend deps
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: HistDiffProcessor-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "HistDiffProcessor v__VERSION__"
          releaseBody: |
            # HistDiff Processor Releases v__VERSION__

            | OS | File type/extension |
            | ---- | --- |
            | Windows | *.exe or *.msi files |
            | MacOS | *.dmg or *.app.tar.gz |
            | Linux | *.rpm, *.deb, or *.AppImage |

            ***NOTE:*** 
            - **These executables are not signed!** 
            - ** On Windows please run away when SmartScan pops up**
            - ** On MacOS please bypass Gatekeep by using** `xattr -cr` *on the generated .app*
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
