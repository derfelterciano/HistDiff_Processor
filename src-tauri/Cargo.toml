[package]
name = "histdiff-pipeline"
version = "0.5.3"
description = "An app that calculates and analyzes HistDiff"
authors = ["Derfel Terciano"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "histdiff_pipeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "*", features = [] }

[dependencies]
# tauri = { version = "*", features = ["devtools"] }
tauri = { version = "*", features = [] }
tauri-plugin-opener = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tauri-plugin-dialog = "*"
histdiff_core = { path = "./histdiff_core"}
tauri-plugin-fs = "*"
rayon = "*"
num_cpus = "*"
log = "*"
lazy_static = "*"
colored = "*"
polars = "*"
cp_hierarchical_clustering = { path = "./cp_hierarchical_clustering"}

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "*"
